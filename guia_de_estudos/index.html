<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estudos</title>
    
    <!-- CSS (Ctrl+Click) -->
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginSection" class="card">
            <i class="fas fa-book-open logo"></i>
            <h1>GUIA DE ESTUDOS</h1>
            <div class="input-group">
                <input type="email" id="lEmail" placeholder="E-mail">
            </div>
            <div class="input-group">
                <input type="password" id="lPass" placeholder="Senha">
            </div>
            <button class="btn" onclick="handleLogin()">Entrar</button>
            <p class="link">Novo? <b onclick="toggleView('reg')">Cadastre-se</b></p>
            <a href="admin.html" class="admin-link">Admin</a>
        </div>

        <!-- TELA DE CADASTRO -->
        <div id="registerSection" class="card hidden">
            <i class="fas fa-book-open logo"></i>
            <h1>CRIAR CONTA</h1>
            <div class="input-group">
                <input type="text" id="rName" placeholder="Nome completo">
            </div>
            <div class="input-group">
                <input type="email" id="rEmail" placeholder="E-mail">
            </div>
            <div class="input-group">
                <input type="password" id="rPass" placeholder="Senha">
            </div>
            <button class="btn" onclick="handleRegister()">Cadastrar</button>
            <p class="link">Já tem conta? <b onclick="toggleView('log')">Login</b></p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashSection" class="dashboard hidden">
            <div class="header">
                <h1><i class="fas fa-book-open"></i> Guia de Estudos</h1>
                <div>
                    <span id="userSpan"></span>
                    <button class="btn-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div id="courseList"></div>
        </div>
        
        <footer>© 2026 Guia de Estudos</footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
